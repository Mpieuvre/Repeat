# Repeat 3.1 - configuration
#
# Color codes:
# - Standard: &0..&9, &a..&f
# - Formats: &k (obfuscated), &l (bold), &m (strikethrough), &n (underline), &o (italic), &r (reset)
# - Hex: &#RRGGBB (example: &#ff00ff)
#
# Placeholders (resolved per player):
# - {online}  current online player count
# - {max}     server max players
# - {player}  receiving player's name
# - {world}   receiving player's world name
# - {server}  server name
#
# Delivery modes:
# - chat         normal chat line
# - action_bar   text above the hotbar
# - boss_bar     bar at the TOP of the screen (like Wither / Dragon / Raid)
#
# Boss bar:
# - Used only to display a message at the top of the screen.
# - The bar stays visible, empties, then Repeat switches to the next boss-bar message.
# - If there is only one, it loops and the progress restarts.
# - color: pink, blue, red, green, yellow, purple, white
# - style: solid, segmented_6, segmented_10, segmented_12, segmented_20
# - durationSeconds: time to empty the bar before the next message
#
# In-game:
#   /repeat help
#   /repeat add bossbar &eYour message
#   /repeat demo wither

enabled: true

# Default interval (in seconds) used when an entry doesn't specify one.
intervalSeconds: 300

# Minimum online players required before any message is broadcast (0 = always).
minPlayers: 0

# When true, only players with repeat.receive permission get messages.
requireReceivePermission: false

# Index of the next message to send (0-based). Usually you shouldn't edit this manually.
nextMessageIndex: 0

entries:
  - message: "&6[Repeat] &fUse &e/repeathelp &ffor help and to configure the plugin."
    intervalSeconds: 300
    delivery: chat
  # Action bar example:
  # - message: "&a{online}/{max} players online &7- &fWelcome {player}!"
  #   intervalSeconds: 120
  #   delivery: action_bar
  #
  # Boss bar example (message at the top of the screen):
  # - message: "&eShop reset in 10 minutes"
  #   delivery: boss_bar
  #   bossbar:
  #     color: yellow
  #     style: solid
  #     durationSeconds: 15
